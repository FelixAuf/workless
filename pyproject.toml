[project]
name = "career-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "argon2-cffi>=23", "apscheduler>=3.11,<4", "openai>=2,<3", "pydantic-settings>=2,<3"]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
[tool.ruff]
line-length = 120
